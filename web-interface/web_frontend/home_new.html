    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { Index } from './module/index.js';

        function createChart(data) {
            const ctx = document.getElementById('graph_canvas');

            if (Index.Chart === undefined) {
                Index.Chart = new Chart(ctx, (data!==undefined ? data : Index.ChartData));
                if (data !== undefined) {
                    Index.ChartData = data;
                }
            } else {
                Index.Chart.data = (data!==undefined ? data.data : Index.ChartData.data);
                Index.Chart.update();
            }

            /*{
                type: 'line',
                data: {
                    labels: ['1', '2', '3', '4', '5', '6', '7', '5', '6', '7'],
                    datasets: [{
                        label: 'Temp 1',
                        backgroundColor: 'rgb(255, 99, 132)',
                        borderColor: 'rgb(255, 99, 132)',
                        data: [0, 10, 5, 2, 20, 30, 45],
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            suggestedMax: 45,
                        }
                    },
                    events: []
                }
            }*/
        }

        Index.ChartFunc = createChart;

        let maze_square_main = document.getElementById("maze_square_main");
        for (let i = 0; i < 16; i++) {
            let row = document.createElement("div");
            row.className = "maze_row";
            for (let j = 0; j < 16; j++) {
                let tile = document.createElement("div");
                tile.className = "maze_tile unselected";
                row.appendChild(tile);
            }
            maze_square_main.appendChild(row);
        }

        window.onload = () => Index.eventLoad();
        window.code = Index; //only for debugging

        document.getElementsByClassName("button_function_start_stop")[0].onclick = () => Index.buttonStartStop();
        document.getElementsByClassName("algo_current")[0].onclick = () => Index.openPopAlgo();
        document.getElementsByClassName("pop_window_algorithm_dimmer")[0].onclick = () => Index.closePopAlgo();
    </script>
</head>
