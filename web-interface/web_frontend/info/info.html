<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info</title>
    <link rel="stylesheet" href="info_style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@<version>/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@<version>/examples/jsm/"
          }
        }
    </script>
</head>
<body>

<div class="body_container">

    <div class="body_header">
        <h1 class="body_header_text">Micromouse Information</h1>
        <div class="link-back_pill unselectable" onclick="document.location.replace(document.location.origin + '/');">Back</div>
    </div>

    <div class="body_content">
        <model-viewer style="width: 100%; height: 100%;"
            src="3d_model/out.glb"
            alt="A Test 3D Model"
            shadow-intensity="1"
            camera-controls>
        </model-viewer>

    </div>

</div>

</body>
</html>
