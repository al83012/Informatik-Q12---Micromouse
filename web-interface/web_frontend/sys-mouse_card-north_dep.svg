<!-- NORTH -->
<div class="mouse-card">
    <svg width="64" height="64" viewBox="0 0 64 64" class="mouse-svg">
        <!-- body -->
        <rect x="16" y="14" width="32" height="36" rx="8" fill="#00ffe0" opacity="0.9"/>
        <!-- nose arrow north -->
        <polygon points="32,6 22,20 42,20" fill="#00ffe0"/>
        <!-- cockpit window -->
        <rect x="22" y="20" width="20" height="14" rx="4" fill="#0b0d14" opacity="0.6"/>
        <!-- eyes (sensors) -->
        <circle cx="25" cy="27" r="3" fill="#00cfff"/>
        <circle cx="39" cy="27" r="3" fill="#00cfff"/>
        <circle cx="25" cy="27" r="1.2" fill="white"/>
        <circle cx="39" cy="27" r="1.2" fill="white"/>
        <!-- wheels -->
        <rect x="10" y="24" width="6" height="14" rx="3" fill="#1e2438"/>
        <rect x="48" y="24" width="6" height="14" rx="3" fill="#1e2438"/>
        <rect x="14" y="42" width="10" height="6" rx="2" fill="#1e2438"/>
        <rect x="40" y="42" width="10" height="6" rx="2" fill="#1e2438"/>
        <!-- glow underline -->
        <line x1="20" y1="50" x2="44" y2="50" stroke="#00ffe0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </svg>
</div>
